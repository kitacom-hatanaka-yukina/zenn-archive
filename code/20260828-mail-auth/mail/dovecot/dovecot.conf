# 最小構成の Dovecot: IMAP で受信箱を見せ、LMTP 配送時に Sieve を通す
protocols = imap lmtp
log_path = /dev/stderr
info_log_path = /dev/stderr

# ラボなので平文 IMAP を許可（TLS なし）
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
first_valid_gid = 5000

# 受信箱に加えて Junk（迷惑メール）等を自動作成・購読する
namespace inbox {
  inbox = yes
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
}

# 認証: me@inbox.example / password
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

# Postfix からの LMTP を Unix ソケットで受ける
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

plugin {
  # 配送前に必ず走るグローバル Sieve。dmarc=fail を Junk に振り分ける。
  sieve_before = /etc/dovecot/sieve/dmarc-junk.sieve
}
